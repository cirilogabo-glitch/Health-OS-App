<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Health OS 2026</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // PASTE YOUR GOOGLE SCRIPT URL HERE
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbznWZi5pZltPamYaNVhSJKSuc0gU_L9aw2FOhfF-em5SToK6JejcOIH4f-U2mB6_c3yIw/exec";
    </script>
    <style>
        body { background-color: #05070a; -webkit-tap-highlight-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const ROUTINE = [
            { id: 'rybelsus', time: '06:00', label: 'Rybelsus 1.5mg', sub: 'Stay upright 60m', icon: '💊', kcal: 0, pro: 0 },
            { id: 'b12', time: '07:00', label: 'B12 Sublingual', sub: 'Methylcobalamin', icon: '⚡', kcal: 0, pro: 0 },
            { id: 'lmnt', time: '11:00', label: 'LMNT + Collagen', sub: '1g Sodium + Protein', icon: '💧', kcal: 40, pro: 10 },
            { id: 'huel', time: '13:00', label: 'Huel + Collagen', sub: 'Multi Essentials', icon: '🥤', kcal: 440, pro: 50 },
            { id: 'dinner', time: '17:30', label: 'Dinner (Lean)', sub: 'Green List Only', icon: '🍽️', kcal: 0, pro: 0 },
            { id: 'magnesium', time: '21:00', label: 'Magnesium', sub: 'Recovery/Sleep', icon: '🌙', kcal: 0, pro: 0 }
        ];

        const App = () => {
            const [checks, setChecks] = useState(new Array(6).fill(false));
            const [loading, setLoading] = useState(false);
            const [weight, setWeight] = useState("--.-");

            // Load current status from Google Sheet
            useEffect(() => {
                fetch(SCRIPT_URL)
                    .then(res => res.json())
                    .then(data => {
                        if (data.checks) setChecks(data.checks);
                        if (data.latestWeight) setWeight(data.latestWeight);
                    })
                    .catch(err => console.log("Offline Mode"));
            }, []);

            const handleToggle = (index, id) => {
                const newChecks = [...checks];
                newChecks[index] = !newChecks[index];
                setChecks(newChecks);

                fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors', // Essential for Google Apps Script
                    body: JSON.stringify({ id: id, value: newChecks[index] })
                });
            };

            const totals = ROUTINE.reduce((acc, item, i) => {
                if (checks[i]) {
                    acc.kcal += item.kcal;
                    acc.pro += item.pro;
                }
                return acc;
            }, { kcal: 0, pro: 0 });

            return (
                <div className="max-w-md mx-auto p-5 pb-24">
                    <header className="flex justify-between items-end mb-6 pt-4">
                        <div>
                            <h1 className="text-2xl font-black italic tracking-tighter">HEALTH OS</h1>
                            <p className="text-[10px] text-blue-500 font-bold uppercase tracking-widest">Protocol 2026</p>
                        </div>
                        <div className="text-right">
                            <span className="text-2xl font-black italic text-white">{weight}</span>
                            <span className="text-[10px] text-slate-500 font-bold ml-1">KG</span>
                        </div>
                    </header>

                    {/* Progress bars */}
                    <div className="grid grid-cols-2 gap-3 mb-8">
                        <div className="bg-slate-900/50 border border-slate-800 p-3 rounded-2xl">
                            <div className="flex justify-between text-[9px] font-black uppercase text-slate-500 mb-1">
                                <span>Energy</span>
                                <span className="text-blue-400">{totals.kcal}/1300</span>
                            </div>
                            <div className="h-1 w-full bg-slate-800 rounded-full overflow-hidden">
                                <div className="h-full bg-blue-500 transition-all" style={{width: `${(totals.kcal/1300)*100}%`}}></div>
                            </div>
                        </div>
                        <div className="bg-slate-900/50 border border-slate-800 p-3 rounded-2xl">
                            <div className="flex justify-between text-[9px] font-black uppercase text-slate-500 mb-1">
                                <span>Protein</span>
                                <span className="text-emerald-400">{totals.pro}g/140g</span>
                            </div>
                            <div className="h-1 w-full bg-slate-800 rounded-full overflow-hidden">
                                <div className="h-full bg-emerald-500 transition-all" style={{width: `${(totals.pro/140)*100}%`}}></div>
                            </div>
                        </div>
                    </div>

                    {/* Routine Items */}
                    <div className="space-y-2">
                        {ROUTINE.map((item, i) => (
                            <div 
                                key={item.id} 
                                onClick={() => handleToggle(i, item.id)}
                                className={`flex items-center gap-4 p-4 rounded-2xl border transition-all active:scale-[0.98] ${checks[i] ? 'bg-emerald-500/5 border-emerald-500/20' : 'bg-slate-900 border-slate-800'}`}
                            >
                                <div className={`w-10 h-10 rounded-xl flex items-center justify-center text-xl ${checks[i] ? 'bg-emerald-500/20' : 'bg-slate-800'}`}>
                                    {item.icon}
                                </div>
                                <div className="flex-1">
                                    <div className="flex items-center gap-2">
                                        <span className={`text-[10px] font-black italic ${checks[i] ? 'text-emerald-500' : 'text-blue-500'}`}>{item.time}</span>
                                        <h3 className={`text-sm font-bold ${checks[i] ? 'text-slate-400' : 'text-white'}`}>{item.label}</h3>
                                    </div>
                                    <p className="text-[10px] text-slate-500 font-medium">{item.sub}</p>
                                </div>
                                <div className={`w-6 h-6 rounded-full border-2 flex items-center justify-center ${checks[i] ? 'bg-emerald-500 border-emerald-500' : 'border-slate-800'}`}>
                                    {checks[i] && <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="4"><path d="M20 6L9 17l-5-5"/></svg>}
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
